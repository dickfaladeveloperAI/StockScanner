<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>智慧選股與波浪支撐壓力儀表板</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #131722; color: #d1d4dc; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #2a2e39; padding-bottom: 15px; }
    select { background: #2a2e39; color: #fff; border: 1px solid #434651; padding: 8px 12px; border-radius: 4px; font-size: 16px; }
    .grid { display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
    #chart { height: 520px; background: #1e222d; border-radius: 8px; border: 1px solid #2a2e39; }
    .card { background: #1e222d; padding: 18px; border-radius: 8px; border: 1px solid #2a2e39; }
    .score { font-size: 32px; font-weight: bold; color: #f23645; margin: 10px 0; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #2a2e39; font-size: 13px; margin-bottom: 10px; }
    .level { font-family: monospace; font-size: 14px; margin: 4px 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2>台股量價結構與波浪分析儀表板</h2>
      <select id="stockSelector" onchange="renderSelectedStock()"></select>
    </header>

    <div class="grid">
      <div id="chart"></div>
      <div class="card">
        <h3 id="stockTitle">載入中...</h3>
        <div id="stockScore" class="score">-</div>
        <div id="stockWave" class="badge">波浪定位：分析中</div>
        <div id="stockStatus"></div>
        <hr style="border:0; border-top:1px solid #2a2e39; margin: 15px 0;">
        <h4>預估支撐 (Support)</h4>
        <div id="supportLevels" style="color: #089981;"></div>
        <h4>預估壓力 (Resistance)</h4>
        <div id="resistanceLevels" style="color: #f23645;"></div>
        <hr style="border:0; border-top:1px solid #2a2e39; margin: 15px 0;">
        <p id="rationale" style="font-size: 13px; line-height: 1.5; color: #787b86;"></p>
      </div>
    </div>
  </div>

  <script>
    let globalData = [];
    let chart, candleSeries, ma5Series, ma20Series, ma60Series;
    let priceLines = [];

    async function init() {
      const res = await fetch('data.json');
      globalData = await res.json();

      const selector = document.getElementById('stockSelector');
      selector.innerHTML = globalData.map((s, idx) => `<option value="${idx}">${s.name} (${s.symbol})</option>`).join('');

      initChart();
      renderSelectedStock();
    }

    function initChart() {
      const container = document.getElementById('chart');
      chart = LightweightCharts.createChart(container, {
        layout: { background: { color: '#1e222d' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
        crosshair: { mode: 0 },
        timeScale: { borderColor: '#2a2e39' }
      });

      // 台股色彩: 上漲為紅 (#f23645)，下跌為綠 (#089981)
      candleSeries = chart.addCandlestickSeries({
        upColor: '#f23645', downColor: '#089981',
        borderUpColor: '#f23645', borderDownColor: '#089981',
        wickUpColor: '#f23645', wickDownColor: '#089981'
      });

      ma5Series = chart.addLineSeries({ color: '#ffeb3b', lineWidth: 1, title: '5MA' });
      ma20Series = chart.addLineSeries({ color: '#29b6f6', lineWidth: 1, title: '20MA' });
      ma60Series = chart.addLineSeries({ color: '#ab47bc', lineWidth: 1, title: '60MA' });
    }

    function renderSelectedStock() {
      const idx = document.getElementById('stockSelector').value;
      const stock = globalData[idx];

      document.getElementById('stockTitle').innerText = `${stock.name} (${stock.symbol}) - 最新價: ${stock.latest_price}`;
      document.getElementById('stockScore').innerText = `${stock.analysis.score} 分`;
      document.getElementById('stockWave').innerText = stock.analysis.wave_status;
      document.getElementById('stockStatus').innerText = `格局：${stock.analysis.sentiment}`;
      document.getElementById('rationale').innerText = stock.analysis.rationale;

      document.getElementById('supportLevels').innerHTML = stock.analysis.support_levels.map(p => `<div class="level">🛡️ ${p}</div>`).join('');
      document.getElementById('resistanceLevels').innerHTML = stock.analysis.resistance_levels.map(p => `<div class="level">⚔️ ${p}</div>`).join('');

      // 更新 K 線與均線圖表
      candleSeries.setData(stock.klines.map(d => ({ time: d.time, open: d.open, high: d.high, low: d.low, close: d.close })));
      ma5Series.setData(stock.klines.filter(d => d.ma5).map(d => ({ time: d.time, value: d.ma5 })));
      ma20Series.setData(stock.klines.filter(d => d.ma20).map(d => ({ time: d.time, value: d.ma20 })));
      ma60Series.setData(stock.klines.filter(d => d.ma60).map(d => ({ time: d.time, value: d.ma60 })));

      // 清除舊的支撐壓力虛線並重繪
      priceLines.forEach(line => candleSeries.removePriceLine(line));
      priceLines = [];

      stock.analysis.support_levels.forEach(p => {
        priceLines.push(candleSeries.createPriceLine({ price: p, color: '#089981', lineWidth: 1, lineStyle: 2, title: '支撐' }));
      });
      stock.analysis.resistance_levels.forEach(p => {
        priceLines.push(candleSeries.createPriceLine({ price: p, color: '#f23645', lineWidth: 1, lineStyle: 2, title: '壓力' }));
      });

      chart.timeScale().fitContent();
    }

    window.onload = init;
  </script>
</body>
</html>
