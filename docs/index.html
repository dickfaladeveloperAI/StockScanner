<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>即時台股自選波浪分析</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #131722; color: #d1d4dc; margin: 0; padding: 12px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .control-panel { background: #1e222d; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #2a2e39; display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; gap: 6px; }
    input, select, button { background: #2a2e39; color: #fff; border: 1px solid #434651; padding: 8px 10px; border-radius: 4px; font-size: 14px; }
    input { flex: 1; }
    button { background: #2962ff; border: none; cursor: pointer; font-weight: bold; }
    button.del-btn { background: #787b86; }
    .grid { display: flex; flex-direction: column; gap: 12px; }
    @media (min-width: 768px) {
      .grid { display: grid; grid-template-columns: 3fr 1fr; }
    }
    #chart-wrapper { width: 100%; height: 380px; position: relative; background: #1e222d; border-radius: 8px; border: 1px solid #2a2e39; }
    #chart { width: 100%; height: 100%; }
    .card { background: #1e222d; padding: 16px; border-radius: 8px; border: 1px solid #2a2e39; }
    .score { font-size: 26px; font-weight: bold; color: #f23645; margin: 6px 0; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #2a2e39; font-size: 12px; margin-bottom: 6px; color: #388bfd; }
    .level { font-family: monospace; font-size: 14px; margin: 3px 0; }
    #statusMsg { font-size: 12px; color: #f59e0b; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="control-panel">
      <!-- API Key 設定 -->
      <div class="input-row">
        <input type="password" id="geminiKey" placeholder="貼上你的 Gemini API Key (存在本機手機中)">
        <button onclick="saveApiKey()">儲存 Key</button>
      </div>
      <!-- 自選股管理 -->
      <div class="input-row">
        <select id="stockSelect" onchange="onSelectStock()" style="flex: 2;"></select>
        <button class="del-btn" onclick="removeCurrentStock()">刪除標的</button>
      </div>
      <div class="input-row">
        <input type="text" id="newStockInput" placeholder="輸入台股代碼 (例: 2330, 6207)">
        <button onclick="addNewStock()">加入並分析</button>
      </div>
      <div id="statusMsg"></div>
    </div>

    <div class="grid">
      <div id="chart-wrapper">
        <div id="chart"></div>
      </div>
      <div class="card">
        <h3 id="stockTitle" style="font-size: 16px; margin: 0 0 6px 0;">請選擇或輸入標的</h3>
        <div id="stockScore" class="score">-</div>
        <div id="stockWave" class="badge">波浪定位：-</div>
        <div id="stockStatus" style="font-size: 13px; color: #787b86;">-</div>
        <hr style="border:0; border-top:1px solid #2a2e39; margin: 10px 0;">
        <h4 style="margin: 4px 0; font-size: 13px; color: #089981;">🛡️ 預估支撐 (Support)</h4>
        <div id="supportLevels"></div>
        <h4 style="margin: 8px 0 4px 0; font-size: 13px; color: #f23645;">⚔️ 預估壓力 (Resistance)</h4>
        <div id="resistanceLevels"></div>
        <hr style="border:0; border-top:1px solid #2a2e39; margin: 10px 0;">
        <p id="rationale" style="font-size: 13px; line-height: 1.5; color: #9da3af; margin: 0;"></p>
      </div>
    </div>
  </div>

  <script>
    let chart, candleSeries, ma5Series, ma20Series, ma60Series;
    let priceLines = [];

    // 初始化本地儲存
    let watchlist = JSON.parse(localStorage.getItem('my_stocks') || '["2330", "2317", "2454"]');

    function showStatus(text) {
      document.getElementById('statusMsg').innerText = text;
    }

    function saveApiKey() {
      const key = document.getElementById('geminiKey').value.trim();
      if (key) {
        localStorage.setItem('user_gemini_key', key);
        showStatus("✅ Gemini API Key 已儲存於本機");
      }
    }

    function refreshSelector() {
      const select = document.getElementById('stockSelect');
      select.innerHTML = watchlist.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    function addNewStock() {
      const input = document.getElementById('newStockInput');
      let code = input.value.trim().toUpperCase().replace('.TW', '').replace('.TWO', '');
      if (!code) return;
      if (!watchlist.includes(code)) {
        watchlist.push(code);
        localStorage.setItem('my_stocks', JSON.stringify(watchlist));
        refreshSelector();
      }
      document.getElementById('stockSelect').value = code;
      input.value = '';
      fetchAndAnalyze(code);
    }

    function removeCurrentStock() {
      const select = document.getElementById('stockSelect');
      const code = select.value;
      watchlist = watchlist.filter(item => item !== code);
      localStorage.setItem('my_stocks', JSON.stringify(watchlist));
      refreshSelector();
      if (watchlist.length > 0) {
        fetchAndAnalyze(watchlist[0]);
      }
    }

    function onSelectStock() {
      const code = document.getElementById('stockSelect').value;
      if (code) fetchAndAnalyze(code);
    }

    function initChart() {
      const container = document.getElementById('chart');
      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: { background: { color: '#1e222d' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
        timeScale: { borderColor: '#2a2e39' }
      });

      // 台股習慣: 紅漲綠跌
      candleSeries = chart.addCandlestickSeries({
        upColor: '#f23645', downColor: '#089981',
        borderUpColor: '#f23645', borderDownColor: '#089981',
        wickUpColor: '#f23645', wickDownColor: '#089981'
      });

      ma5Series = chart.addLineSeries({ color: '#f59e0b', lineWidth: 1.5, title: '5MA' });
      ma20Series = chart.addLineSeries({ color: '#388bfd', lineWidth: 1.5, title: '20MA' });
      ma60Series = chart.addLineSeries({ color: '#a855f7', lineWidth: 1.5, title: '60MA' });

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });
    }

    // 計算移動平均線
    function calculateSMA(data, count) {
      const result = [];
      for (let i = 0; i < data.length; i++) {
        if (i < count - 1) continue;
        let sum = 0;
        for (let j = 0; j < count; j++) {
          sum += data[i - j].close;
        }
        result.push({ time: data[i].time, value: +(sum / count).toFixed(2) });
      }
      return result;
    }

    // 抓取即時日 K 線
    async function fetchKlines(code) {
      const symbols = [`${code}.TW`, `${code}.TWO`];
      for (let sym of symbols) {
        try {
          const url = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=6mo&interval=1d`;
          const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
          const json = await res.json();
          const result = json.chart.result[0];
          const quote = result.indicators.quote[0];
          const timestamps = result.timestamp;

          const klines = [];
          for (let i = 0; i < timestamps.length; i++) {
            if (quote.open[i] && quote.close[i]) {
              const d = new Date(timestamps[i] * 1000);
              const timeStr = d.toISOString().split('T')[0];
              klines.push({
                time: timeStr,
                open: +quote.open[i].toFixed(2),
                high: +quote.high[i].toFixed(2),
                low: +quote.low[i].toFixed(2),
                close: +quote.close[i].toFixed(2),
                volume: quote.volume[i] || 0
              });
            }
          }
          if (klines.length > 30) return { symbol: sym, klines };
        } catch (e) {
          continue;
        }
      }
      throw new Error("無法取得此標的行情資料");
    }

    // 提取轉折極值點
    function extractPivots(klines) {
      const pivots = [];
      for (let i = 5; i < klines.length - 5; i++) {
        const curHigh = klines[i].high;
        const curLow = klines[i].low;
        let isHigh = true, isLow = true;
        for (let j = i - 5; j <= i + 5; j++) {
          if (j === i) continue;
          if (klines[j].high >= curHigh) isHigh = false;
          if (klines[j].low <= curLow) isLow = false;
        }
        if (isHigh) pivots.push({ type: '高點', price: curHigh, date: klines[i].time });
        if (isLow) pivots.push({ type: '低點', price: curLow, date: klines[i].time });
      }
      return pivots.slice(-6);
    }

    // 呼叫 Gemini REST API
    async function requestGemini(apiKey, payload) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: payload }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });
      const data = await res.json();
      return JSON.parse(data.candidates[0].content.parts[0].text);
    }

    async function fetchAndAnalyze(code) {
      showStatus(`⏳ 正在取得 ${code} 最新即時行情...`);
      try {
        const { symbol, klines } = await fetchKlines(code);
        
        // 渲染圖表與均線
        candleSeries.setData(klines);
        ma5Series.setData(calculateSMA(klines, 5));
        ma20Series.setData(calculateSMA(klines, 20));
        ma60Series.setData(calculateSMA(klines, 60));
        chart.timeScale().fitContent();

        const latest = klines[klines.length - 1];
        const ma20 = calculateSMA(klines, 20).slice(-1)[0]?.value;
        const ma60 = calculateSMA(klines, 60).slice(-1)[0]?.value;
        const pivots = extractPivots(klines);

        document.getElementById('stockTitle').innerText = `${code} (${symbol}) - 最新: ${latest.close}`;

        const apiKey = localStorage.getItem('user_gemini_key') || document.getElementById('geminiKey').value.trim();
        if (!apiKey) {
          showStatus("⚠️ 圖表已載入。請先於上方輸入 Gemini API Key 以啟動波浪分析。");
          return;
        }

        showStatus(`🤖 正在連線 Gemini 進行即時波浪與價量推算...`);
        const prompt = `
你是一位資深技術分析專家。根據 ${symbol} 資料推算：
- 收盤價: ${latest.close}, 20MA: ${ma20}, 60MA: ${ma60}
- 近期波段極值: ${JSON.stringify(pivots)}
請以繁體中文與 JSON 輸出：
{
  "wave_status": "推測波浪位置",
  "support_levels": [支撐1, 支撐2],
  "resistance_levels": [壓力1, 壓力2],
  "sentiment": "多頭 / 整理 / 偏空",
  "score": 1到10數字,
  "rationale": "一句話量價結構解析"
}`;

        const analysis = await requestGemini(apiKey, prompt);

        // 渲染分析資訊
        document.getElementById('stockScore').innerText = `${analysis.score} 分`;
        document.getElementById('stockWave').innerText = analysis.wave_status;
        document.getElementById('stockStatus').innerText = `格局：${analysis.sentiment}`;
        document.getElementById('rationale').innerText = analysis.rationale;
        document.getElementById('supportLevels').innerHTML = analysis.support_levels.map(p => `<div class="level" style="color: #089981;">$ ${p}</div>`).join('');
        document.getElementById('resistanceLevels').innerHTML = analysis.resistance_levels.map(p => `<div class="level" style="color: #f23645;">$ ${p}</div>`).join('');

        // 繪製支撐壓力水平線
        priceLines.forEach(l => candleSeries.removePriceLine(l));
        priceLines = [];
        analysis.support_levels.forEach(p => priceLines.push(candleSeries.createPriceLine({ price: Number(p), color: '#089981', lineWidth: 1, lineStyle: 2, title: '支撐' })));
        analysis.resistance_levels.forEach(p => priceLines.push(candleSeries.createPriceLine({ price: Number(p), color: '#f23645', lineWidth: 1, lineStyle: 2, title: '壓力' })));

        showStatus("✅ 即時分析完成");
      } catch (err) {
        showStatus(`❌ 錯誤: ${err.message}`);
      }
    }

    window.onload = () => {
      initChart();
      const savedKey = localStorage.getItem('user_gemini_key');
      if (savedKey) document.getElementById('geminiKey').value = savedKey;
      refreshSelector();
      if (watchlist.length > 0) fetchAndAnalyze(watchlist[0]);
    };
  </script>
</body>
</html>
