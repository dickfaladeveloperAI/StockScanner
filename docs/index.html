<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>台股量價結構與波浪分析儀表板</title>
  <!-- 鎖定穩定版本 Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #131722; color: #d1d4dc; margin: 0; padding: 12px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #2a2e39; padding-bottom: 12px; }
    @media (min-width: 768px) {
      header { flex-direction: row; justify-content: space-between; align-items: center; }
    }
    h2 { font-size: 18px; margin: 0; }
    select { background: #2a2e39; color: #fff; border: 1px solid #434651; padding: 8px 12px; border-radius: 6px; font-size: 15px; width: 100%; max-width: 320px; }
    .grid { display: flex; flex-direction: column; gap: 15px; }
    @media (min-width: 768px) {
      .grid { display: grid; grid-template-columns: 3fr 1fr; }
    }
    #chart-wrapper { width: 100%; height: 380px; position: relative; background: #1e222d; border-radius: 8px; border: 1px solid #2a2e39; overflow: hidden; }
    #chart { width: 100%; height: 100%; }
    .card { background: #1e222d; padding: 16px; border-radius: 8px; border: 1px solid #2a2e39; }
    .score { font-size: 28px; font-weight: bold; color: #f23645; margin: 8px 0; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #2a2e39; font-size: 12px; margin-bottom: 8px; color: #388bfd; }
    .level { font-family: monospace; font-size: 14px; margin: 4px 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2>台股量價結構與波浪分析儀表板</h2>
      <select id="stockSelector" onchange="renderSelectedStock()"></select>
    </header>

    <div class="grid">
      <div id="chart-wrapper">
        <div id="chart"></div>
      </div>
      <div class="card">
        <h3 id="stockTitle" style="font-size: 16px; margin: 0 0 8px 0;">-</h3>
        <div id="stockScore" class="score">-</div>
        <div id="stockWave" class="badge">-</div>
        <div id="stockStatus" style="font-size: 13px; color: #787b86;">-</div>
        <hr style="border:0; border-top:1px solid #2a2e39; margin: 12px 0;">
        <h4 style="margin: 6px 0; font-size: 14px; color: #089981;">🛡️ 預估支撐 (Support)</h4>
        <div id="supportLevels"></div>
        <h4 style="margin: 10px 0 6px 0; font-size: 14px; color: #f23645;">⚔️ 預估壓力 (Resistance)</h4>
        <div id="resistanceLevels"></div>
        <hr style="border:0; border-top:1px solid #2a2e39; margin: 12px 0;">
        <p id="rationale" style="font-size: 13px; line-height: 1.5; color: #9da3af; margin: 0;"></p>
      </div>
    </div>
  </div>

  <script>
    let globalData = [];
    let chart = null;
    let candleSeries = null;
    let ma5Series = null;
    let ma20Series = null;
    let ma60Series = null;
    let priceLines = [];

    async function init() {
      try {
        const res = await fetch('data.json?v=' + Date.now());
        globalData = await res.json();

        const selector = document.getElementById('stockSelector');
        selector.innerHTML = globalData.map((s, idx) => `<option value="${idx}">${s.name} (${s.symbol})</option>`).join('');

        initChart();
        renderSelectedStock();
      } catch (err) {
        console.error("載入資料失敗:", err);
      }
    }

    function initChart() {
      const container = document.getElementById('chart');
      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { color: '#1e222d' },
          textColor: '#d1d4dc',
        },
        grid: {
          vertLines: { color: '#2a2e39' },
          horzLines: { color: '#2a2e39' },
        },
        timeScale: {
          borderColor: '#2a2e39',
        },
        rightPriceScale: {
          borderColor: '#2a2e39',
        }
      });

      // 台股色彩: 紅漲綠跌
      candleSeries = chart.addCandlestickSeries({
        upColor: '#f23645',
        downColor: '#089981',
        borderUpColor: '#f23645',
        borderDownColor: '#089981',
        wickUpColor: '#f23645',
        wickDownColor: '#089981'
      });

      ma5Series = chart.addLineSeries({ color: '#f59e0b', lineWidth: 1.5, title: '5MA' });
      ma20Series = chart.addLineSeries({ color: '#388bfd', lineWidth: 1.5, title: '20MA' });
      ma60Series = chart.addLineSeries({ color: '#a855f7', lineWidth: 1.5, title: '60MA' });

      window.addEventListener('resize', () => {
        chart.applyOptions({
          width: container.clientWidth,
          height: container.clientHeight
        });
      });
    }

    function renderSelectedStock() {
      const idx = document.getElementById('stockSelector').value;
      const stock = globalData[idx];
      if (!stock) return;

      document.getElementById('stockTitle').innerText = `${stock.name} (${stock.symbol}) - 最新價: ${stock.latest_price}`;
      document.getElementById('stockScore').innerText = `${stock.analysis.score} 分`;
      document.getElementById('stockWave').innerText = stock.analysis.wave_status;
      document.getElementById('stockStatus').innerText = `格局：${stock.analysis.sentiment}`;
      document.getElementById('rationale').innerText = stock.analysis.rationale;

      document.getElementById('supportLevels').innerHTML = stock.analysis.support_levels.map(p => `<div class="level" style="color: #089981;">$ ${p}</div>`).join('');
      document.getElementById('resistanceLevels').innerHTML = stock.analysis.resistance_levels.map(p => `<div class="level" style="color: #f23645;">$ ${p}</div>`).join('');

      // 清除舊水平線
      priceLines.forEach(line => candleSeries.removePriceLine(line));
      priceLines = [];

      // 載入 K 線並確保時間正序且唯一
      const sortedKlines = stock.klines.sort((a, b) => a.time.localeCompare(b.time));
      candleSeries.setData(sortedKlines.map(d => ({
        time: d.time,
        open: d.open,
        high: d.high,
        low: d.low,
        close: d.close
      })));

      ma5Series.setData(sortedKlines.filter(d => d.ma5 !== null).map(d => ({ time: d.time, value: d.ma5 })));
      ma20Series.setData(sortedKlines.filter(d => d.ma20 !== null).map(d => ({ time: d.time, value: d.ma20 })));
      ma60Series.setData(sortedKlines.filter(d => d.ma60 !== null).map(d => ({ time: d.time, value: d.ma60 })));

      // 畫出 Gemini 預估的支撐與壓力線
      if (stock.analysis.support_levels) {
        stock.analysis.support_levels.forEach(p => {
          priceLines.push(candleSeries.createPriceLine({
            price: Number(p),
            color: '#089981',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: '支撐'
          }));
        });
      }

      if (stock.analysis.resistance_levels) {
        stock.analysis.resistance_levels.forEach(p => {
          priceLines.push(candleSeries.createPriceLine({
            price: Number(p),
            color: '#f23645',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: '壓力'
          }));
        });
      }

      chart.timeScale().fitContent();
    }

    window.onload = init;
  </script>
</body>
</html>
