name: Run Stock Analysis & Publish Pages

on:
  schedule:
    # 台灣時間週一至週五 16:00 (UTC 08:00) 自動執行
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵點擊執行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予 GitHub Actions 推送代碼與資料的權限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Screener Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_screener.py

      - name: Commit & Push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Auto-update stock analysis data [skip ci]" || exit 0
          git push
